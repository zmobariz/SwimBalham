name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build portable executable
        run: pyinstaller --noconfirm --clean build.spec

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'dist\SwimBalham.exe')) {
            throw 'dist\SwimBalham.exe was not created'
          }
          Get-Item -LiteralPath 'dist\SwimBalham.exe' | Format-List Name, Length, VersionInfo

      - name: Upload test build
        uses: actions/upload-artifact@v7
        with:
          name: SwimBalham-windows-test-build
          path: dist/SwimBalham.exe
          if-no-files-found: error
          retention-days: 14
